# XcodeGen spec. On a Mac: `brew install xcodegen && cd apps/ios && xcodegen generate`,
# then open Kith.xcodeproj. CI (.github/workflows/ios.yml) does the same and builds
# an unsigned IPA that 3uTools (or Xcode with your own team) can sign and install.
name: Kith
options:
  bundleIdPrefix: app.kith
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  LineupEngine:
    path: ../../packages/LineupEngine
  KithCore:
    path: ../../packages/KithCore
  GridGames:
    path: ../../packages/GridGames
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.24.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is intentionally left to the developer / CI. CI builds with
    # CODE_SIGNING_ALLOWED=NO and exports an unsigned .ipa.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Kith:
    type: application
    platform: iOS
    sources:
      - path: Kith
      # Config.plist is gitignored, so the directory scan above may not find it.
      # Declaring it explicitly pins it to the resources phase when it is there and
      # keeps `xcodegen generate` working when it is not.
      - path: Kith/Config/Config.plist
        buildPhase: resources
        optional: true
    dependencies:
      - package: LineupEngine
      - package: KithCore
      - package: GridGames
      - package: Supabase
        product: Supabase
    info:
      path: Kith/Info.plist
      properties:
        CFBundleDisplayName: Kith
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSContactsUsageDescription: "Kith uses your contacts only to find friends who already play. Numbers are hashed on your phone; names never leave it."
        CFBundleURLTypes:
          - CFBundleURLName: app.kith.ios
            CFBundleURLSchemes: [kith]
        UIBackgroundModes: [remote-notification]
        # Filled from a Config.plist at build time; see Kith/Config/AppConfig.swift.
    entitlements:
      path: Kith/Kith.entitlements
      properties:
        # Push and associated domains need a paid team; a free Apple ID (3uTools
        # sideload) will strip these and the app degrades gracefully.
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:kith.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kith.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        # Both live in Resources/Assets.xcassets; naming them here is what makes the
        # tab bar tint and the app icon actually resolve.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # In-process unit tests hosted by the app (AppModel + fakes). See TESTING.md §4.
  KithTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KithTests
    dependencies:
      - target: Kith
      - package: LineupEngine
      - package: KithCore
      - package: GridGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kith.ios.tests
        GENERATE_INFOPLIST_FILE: true

  # Simulator UI tests driving the real views against FakeKithAPI. See TESTING.md §5.
  KithUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KithUITests
    dependencies:
      - target: Kith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kith.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Kith

  # Live end-to-end against the real backend. Not in the Kith scheme's test action;
  # run via the KithLive scheme only (TESTING.md §7).
  KithLiveTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KithLiveTests
    dependencies:
      - target: Kith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kith.ios.livetests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Kith

schemes:
  KithLive:
    build:
      targets:
        Kith: all
        KithLiveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KithLiveTests
  Kith:
    build:
      targets:
        Kith: all
        KithTests: [test]
        KithUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KithTests
        - KithUITests
    archive:
      config: Release
