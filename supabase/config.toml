# Supabase CLI config for Kith.
#
# WARNING: do NOT run `supabase config push`. The CLI merges this file with its own
# template defaults, so a push would overwrite hosted auth/storage/pooler settings
# (verified with `supabase config diff` on 2026-09-12). Auth settings are managed in
# the dashboard; this file exists for `supabase link`, `db push`, `functions deploy`,
# and as documentation of the phone-auth settings the app relies on. Local development (`supabase start`) is not used;
# tests run against pglite (supabase/tests) and the hosted project.
project_id = "kith"

[auth.sms]
# Phone OTP is the only sign-in method (docs/02 §9).
enable_signup = true
enable_confirmations = true
max_frequency = "5s"

# Pre-defined phone → OTP pairs: no SMS is sent, the fixed code is accepted.
# +1 500 555 0006 is a non-routable Twilio "magic" number; used by the CI live
# end-to-end test (apps/ios/TESTING.md §7) and safe for local device testing.
# The SMS provider itself (Twilio Verify) is configured in the dashboard.
[auth.sms.test_otp]
15005550006 = "123456"
