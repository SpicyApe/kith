name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  packages:
    name: Swift packages (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: LineupEngine tests
        run: swift test --package-path packages/LineupEngine
      - name: KithCore tests
        run: swift test --package-path packages/KithCore

  app:
    name: Unsigned IPA
    runs-on: macos-14
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Config.plist
        working-directory: apps/ios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp Kith/Config/Config.example.plist Kith/Config/Config.plist
          if [ -n "$SUPABASE_URL" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL $SUPABASE_URL" Kith/Config/Config.plist
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY $SUPABASE_ANON_KEY" Kith/Config/Config.plist
          fi
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: apps/ios
        run: |
          xcodebuild -project Kith.xcodeproj -scheme Kith -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" -quiet build
      - name: Package IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kith.app Payload/
          zip -qr Kith-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kith-unsigned.ipa
          path: apps/ios/Kith-unsigned.ipa
          if-no-files-found: error
