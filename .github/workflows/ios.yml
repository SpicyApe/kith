name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run the live end-to-end test against the real backend
        type: boolean
        default: false

env:
  XCODE_SELECT: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app

jobs:
  packages:
    name: Swift packages (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ${{ env.XCODE_SELECT }}
      - name: LineupEngine tests
        run: swift test --package-path packages/LineupEngine
      - name: KithCore tests
        run: swift test --package-path packages/KithCore

  simulator-tests:
    name: App unit + UI tests (simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ${{ env.XCODE_SELECT }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Config.plist (placeholders are fine for tests)
        working-directory: apps/ios
        run: cp Kith/Config/Config.example.plist Kith/Config/Config.plist
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          # First available iPhone on the newest iOS runtime the selected Xcode can use.
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key) | reverse
            | map(.value[] | select(.isAvailable and (.name | startswith("iPhone"))))
            | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: apps/ios
        run: |
          xcodebuild test -project Kith.xcodeproj -scheme Kith \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
      - name: Test failure details
        if: failure()
        working-directory: apps/ios
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json || true
          jq -r '.testFailures[]? | "\(.testName): \(.failureText)"' summary.json || cat summary.json | head -100
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: apps/ios/TestResults.xcresult

  live-e2e:
    name: Live end-to-end (real backend)
    runs-on: macos-14
    needs: simulator-tests
    if: ${{ vars.KITH_LIVE_E2E == 'true' || inputs.live == true }}
    # One live run at a time: they all sign in as the same Supabase test number and
    # delete that account at the end, so overlapping runs would trip each other up.
    concurrency:
      group: kith-live-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ${{ env.XCODE_SELECT }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Config.plist from secrets
        working-directory: apps/ios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are required for the live test"; exit 1
          fi
          cp Kith/Config/Config.example.plist Kith/Config/Config.plist
          /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL $SUPABASE_URL" Kith/Config/Config.plist
          /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY $SUPABASE_ANON_KEY" Kith/Config/Config.plist
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key) | reverse
            | map(.value[] | select(.isAvailable and (.name | startswith("iPhone"))))
            | .[0].udid // empty')
          [ -n "$udid" ] || { echo "No available iPhone simulator"; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Pre-boot so the very first app launch (there are no unit tests to warm
          # things up in this job) does not race the simulator's own boot; a cold
          # boot here produced "Timed out while acquiring background assertion".
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Live test
        working-directory: apps/ios
        env:
          TEST_RUNNER_KITH_TEST_PHONE: ${{ secrets.KITH_TEST_PHONE }}
          TEST_RUNNER_KITH_TEST_OTP: ${{ secrets.KITH_TEST_OTP }}
        run: |
          xcodebuild test -project Kith.xcodeproj -scheme KithLive \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath LiveResults.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
      - name: Live test failure details
        if: failure()
        working-directory: apps/ios
        run: |
          xcrun xcresulttool get test-results summary --path LiveResults.xcresult > summary.json || true
          jq -r '.testFailures[]? | "\(.testName): \(.failureText)"' summary.json || cat summary.json | head -100
      - name: Upload live results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiveResults.xcresult
          path: apps/ios/LiveResults.xcresult
          if-no-files-found: ignore

  app:
    name: Unsigned IPA
    runs-on: macos-14
    needs: [packages, simulator-tests]
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ${{ env.XCODE_SELECT }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Config.plist
        working-directory: apps/ios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp Kith/Config/Config.example.plist Kith/Config/Config.plist
          if [ -n "$SUPABASE_URL" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL $SUPABASE_URL" Kith/Config/Config.plist
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY $SUPABASE_ANON_KEY" Kith/Config/Config.plist
          fi
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: apps/ios
        run: |
          xcodebuild -project Kith.xcodeproj -scheme Kith -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="" \
            -quiet build
      - name: Package IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kith.app Payload/
          zip -qr Kith-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kith-unsigned.ipa
          path: apps/ios/Kith-unsigned.ipa
          if-no-files-found: error
