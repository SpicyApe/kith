name: iOS

on:
  push:
    branches: [main, ci-tests]
  pull_request:
  workflow_dispatch:

env:
  XCODE_SELECT: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app

jobs:
  packages:
    name: Swift packages (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ${{ env.XCODE_SELECT }}
      - name: LineupEngine tests
        run: swift test --package-path packages/LineupEngine
      - name: KithCore tests
        run: swift test --package-path packages/KithCore

  simulator-tests:
    name: App unit + UI tests (simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ${{ env.XCODE_SELECT }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Config.plist (placeholders are fine for tests)
        working-directory: apps/ios
        run: cp Kith/Config/Config.example.plist Kith/Config/Config.plist
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          # First available iPhone on the newest iOS runtime the selected Xcode can use.
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key) | reverse
            | map(.value[] | select(.isAvailable and (.name | startswith("iPhone"))))
            | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: apps/ios
        run: |
          xcodebuild test -project Kith.xcodeproj -scheme Kith \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
      - name: Test failure details
        if: failure()
        working-directory: apps/ios
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json || true
          jq -r '.testFailures[]? | "\(.testName): \(.failureText)"' summary.json || cat summary.json | head -100
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: apps/ios/TestResults.xcresult

  app:
    name: Unsigned IPA
    runs-on: macos-14
    needs: [packages, simulator-tests]
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ${{ env.XCODE_SELECT }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Config.plist
        working-directory: apps/ios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp Kith/Config/Config.example.plist Kith/Config/Config.plist
          if [ -n "$SUPABASE_URL" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL $SUPABASE_URL" Kith/Config/Config.plist
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY $SUPABASE_ANON_KEY" Kith/Config/Config.plist
          fi
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: apps/ios
        run: |
          xcodebuild -project Kith.xcodeproj -scheme Kith -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="" \
            -quiet build
      - name: Package IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kith.app Payload/
          zip -qr Kith-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kith-unsigned.ipa
          path: apps/ios/Kith-unsigned.ipa
          if-no-files-found: error
